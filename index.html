<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPVT-5 | Selección de evaluación</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f4f6f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;color:#1e293b}
.app{width:100%;max-width:560px}
.header{text-align:center;margin-bottom:1.5rem}
.logo{width:58px;height:58px;border-radius:18px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:29px;margin:0 auto 1rem}
.title{font-size:24px;font-weight:700;margin-bottom:6px}
.subtitle{font-size:14px;color:#64748b;line-height:1.5}
.card{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card-title{font-size:16px;font-weight:600;margin-bottom:1rem}
.options{display:grid;gap:12px}
.test-link{display:flex;align-items:center;gap:14px;padding:1rem;text-decoration:none;border:1.5px solid #e2e8f0;border-radius:14px;color:#1e293b;transition:border-color .15s,background .15s,transform .15s}
.test-link:hover{border-color:#a5b4fc;background:#f8f7ff;transform:translateY(-1px)}
.test-icon{width:42px;height:42px;border-radius:12px;background:#eef2ff;color:#6366f1;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.test-info{min-width:0;flex:1}
.test-name{font-size:15px;font-weight:700;margin-bottom:3px}
.test-description{font-size:12px;color:#64748b;line-height:1.4}
.arrow{font-size:20px;color:#94a3b8;line-height:1}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:1rem}
@media(max-width:420px){.card{padding:1rem}.title{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="logo" aria-hidden="true">📋</div>
    <h1 class="title">PPVT-5</h1>
    <p class="subtitle">Test de Vocabulario en Imágenes Peabody</p>
  </header>

  <section class="card" aria-labelledby="selection-title">
    <h2 id="selection-title" class="card-title">Selecciona la evaluación</h2>
    <nav class="options" aria-label="Tipos de evaluación">
      <a class="test-link" href="pretest_index.html">
        <span class="test-icon" aria-hidden="true">①</span>
        <span class="test-info">
          <span class="test-name">Pretest</span>
          <span class="test-description">Evaluación inicial del vocabulario.</span>
        </span>
        <span class="arrow" aria-hidden="true">&#8250;</span>
      </a>
      <a class="test-link" href="postest_index.html">
        <span class="test-icon" aria-hidden="true">②</span>
        <span class="test-info">
          <span class="test-name">Postest</span>
          <span class="test-description">Evaluación posterior a la clase de Word.</span>
        </span>
        <span class="arrow" aria-hidden="true">&#8250;</span>
      </a>
    </nav>
  </section>

  <p class="footer">Elige una opción para comenzar</p>
</main>
</body>
</html>
